name: verify

# 多轮功能测试：把本地那套 6 轮验收搬到 CI，让"能不能用"在每次 push 上被重新回答。
#
# 为什么用 `--fast` 而不是跑满 6 轮：
# 第 4 轮（变异测试）要反复跑整套测试（本项目 28 个变异体 × 单进程全套），
# 在 GitHub 免费 runner 上会吃掉大量时间。变异测试**本地/发布前必跑**，
# CI 上按需触发（workflow_dispatch 或加 label）。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: '跑满全部轮次（含变异测试与真机探测）'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 第 1–3、5 轮：加载、行为回归、覆盖门、脱敏检查。
      # 这些是发布面的**硬门槛**，任何一条红都不该合并。
      - name: 多轮功能测试（不含慢轮）
        run: node scripts/functional-suite.mjs --fast

      # 第 4 轮：变异测试（覆盖质量）。只在显式请求时跑。
      - name: 变异测试（覆盖质量）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: node scripts/mutants.mjs

      # 第 6 轮：真机探测。CI runner 上没有 Windows-MCP，
      # 因此**预期 skip**——脚本会明确说明"本环境未验证"而不是假装通过。
      - name: 真机探测（CI 上预期 skip）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: node scripts/live-probe.mjs
        continue-on-error: true
